name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install the required SDK packages
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [[ -z "$SDK_MANAGER" ]]; then
            echo "No sdkmanager found in the runner's Android SDK" >&2
            exit 1
          fi
          yes | "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.run_number }}
          path: |
            app/build/test-results/**/*.xml
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7
